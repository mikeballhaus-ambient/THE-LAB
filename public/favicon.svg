<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Lab">
  <!--
    Transparent background — only the flask is drawn, so it sits cleanly on any browser
    tab colour instead of carrying its own plate.

    Matches the in-app lockup mark: `fa-solid fa-flask rotate-4`, i.e. a solid flask tilted
    4° clockwise, in slate-400 (`rgb(148, 163, 184)`).

    The neck bore is a **second subpath in the same `d`** with `fill-rule="evenodd"`, so it
    is punched out of the silhouette rather than painted over. That makes it genuinely
    transparent — a `#000`-ish fill would look like a hole only while the tab background
    happened to be dark.
  -->
  <g transform="rotate(4 16 16)">
    <path
      fill="rgb(148, 163, 184)"
      fill-rule="evenodd"
      d="M11.6 3.9h8.8a1.55 1.55 0 0 1 0 3.1h-.5v6.62l5.35 9.68A3.75 3.75 0 0 1 22.0 28.6H10.0a3.75 3.75 0 0 1-3.25-5.3l5.35-9.68V7h-.5a1.55 1.55 0 0 1 0-3.1z
         M14.3 15.35V8.1a0.5 0.5 0 0 1 .5-.5h2.4a0.5 0.5 0 0 1 .5.5v7.25z"
    />
    <!-- Subtle inner cone, kept as a hint of depth in the body only. -->
    <path
      fill="#6b7a90"
      opacity="0.5"
      d="M14.55 15.4h2.9l3.15 5.7a1.5 1.5 0 0 1-1.31 2.25H12.71a1.5 1.5 0 0 1-1.31-2.25l3.15-5.7z"
    />
  </g>
</svg>
